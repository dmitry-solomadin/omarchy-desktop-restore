<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Desktop Restore for Omarchy</title>
  <desc>Desktop Restore features on a dark Ristretto coffee-and-orange palette: exact agent-session resume, popular terminals, apps and browsers, and workspace layout.</desc>
  <!-- Palette: Omarchy Ristretto colors.toml. Original artwork. -->
  <defs>
    <radialGradient id="coffee" cx="100%" cy="0%" r="100%">
      <stop offset="0" stop-color="#3d2f2a"/>
      <stop offset="1" stop-color="#211b1b"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#coffee)"/>

  <g font-family="Liberation Sans, Arial, sans-serif">
    <rect x="98" y="82" width="34" height="4" rx="2" fill="#f38d70"/>
    <text x="148" y="91" font-size="18" letter-spacing="3" fill="#c3b7b8">AN OMARCHY PLUGIN</text>
    <text x="90" y="224" font-size="108" font-weight="700" letter-spacing="-4" fill="#e6d9db">Desktop <tspan fill="#fb9a77">Restore</tspan></text>
    <text x="98" y="283" font-size="30" fill="#c3b7b8">Automatic saves · Restore with Super + Shift + R</text>
  </g>
  <path d="M98 329H1502" stroke="#7d4d3b" stroke-width="1.5"/>

  <g fill="#2c2525" stroke="#403e41" stroke-width="1.5">
    <rect x="98" y="372" width="686" height="166" rx="10"/>
    <rect x="816" y="372" width="686" height="166" rx="10"/>
    <rect x="98" y="562" width="686" height="166" rx="10"/>
    <rect x="816" y="562" width="686" height="166" rx="10"/>
  </g>
  <g font-family="Liberation Mono, monospace" font-size="21" fill="#f38d70">
    <text x="124" y="418">01</text>
    <text x="842" y="418">02</text>
    <text x="124" y="608">03</text>
    <text x="842" y="608">04</text>
  </g>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <g font-size="31" font-weight="700" fill="#e6d9db">
      <text x="178" y="421">Exact agent-session resume</text>
      <text x="896" y="421">Popular terminals supported</text>
      <text x="178" y="611">Apps &amp; browser windows</text>
      <text x="896" y="611">Workspaces &amp; window layout</text>
    </g>
    <g font-size="23" fill="#c3b7b8">
      <text x="178" y="466">OpenCode 1 &amp; 2 · Claude Code · Codex</text>
      <text x="178" y="502">Plus default &amp; named herdr sessions.</text>
      <text x="896" y="466">Ghostty · Foot · Kitty · Alacritty · WezTerm</text>
      <text x="896" y="502">Reopen in the same working directory.</text>
      <text x="178" y="656">Bring back everyday apps and browser sessions</text>
      <text x="178" y="692">using each application's native recovery.</text>
      <text x="896" y="656">Workspaces, monitors &amp; floating geometry.</text>
      <text x="896" y="692">Fullscreen state included.</text>
    </g>
  </g>

</svg>
